[project]
name = "scholar-agent"
version = "0.1.0"
description = "论文复现 + 框架评测 + 代码执行的 Agent 系统（Go 重构 Python）"
requires-python = ">=3.12"
dependencies = [
    # Web 框架
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    # Agent 编排 + LLM
    "langgraph>=0.2.50",
    "langgraph-checkpoint-redis>=0.0.1",
    "langchain-openai>=0.2.0",
    "langchain-core>=0.3.0",
    # 沙箱
    "docker>=7.1.0",
    # GitHub 搜索
    "PyGithub>=2.5.0",
    # 缓存/记忆
    "redis[hiredis]>=5.2.0",
    # 数据验证 + 配置
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    # 日志
    "structlog>=24.4.0",
    # HTTP 客户端（LLM 调用底层）
    "httpx>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "fakeredis>=2.26.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scholar_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = [
    # str+Enum → StrEnum 会改变 str() 语义（需专项迁移 + 回归），暂缓
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
"scholar_agent/api/routes.py" = ["B008"]    # FastAPI Depends() 惯例写法
"scholar_agent/agent/prompts/*" = ["E501"]  # prompt 长文本行天然超长
"tests/*" = ["E501"]                        # 测试里的长 URL/参数保持单行可读

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
